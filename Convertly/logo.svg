<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
    <defs>
        <!-- Convertly purple gradient -->
        <linearGradient id="convertlyGradient"
            x1="0"
            y1="0"
            x2="1"
            y2="1">
            <stop offset="0%" stop-color="#756cff"/>
            <stop offset="45%" stop-color="#635bff"/>
            <stop offset="100%" stop-color="#5148e8"/>
        </linearGradient>
    </defs>

    <!-- Main rounded logo background -->
    <rect
        x="0"
        y="0"
        width="64"
        height="64"
        rx="16"
        fill="url(#convertlyGradient)"
    />

    <!-- Subtle highlight from .brand-icon::before -->
    <circle
        cx="58"
        cy="6"
        r="15"
        fill="#ffffff"
        fill-opacity="0.14"
    />

    <!-- Conversion arrows -->
    <g
        fill="none"
        stroke="#ffffff"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
    >
        <!-- Top arrow -->
        <path d="M17 22H46"/>
        <path d="M39 15L46 22L39 29"/>

        <!-- Bottom arrow -->
        <path d="M47 42H18"/>
        <path d="M25 35L18 42L25 49"/>
    </g>
</svg>